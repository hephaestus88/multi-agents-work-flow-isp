[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-isp"
version = "0.1.0"
description = "Agent-oriented DNG and RAW10/RAW12 to BMP reference workflow"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<14"]

[project.optional-dependencies]
dng = ["rawpy>=0.21,<0.29"]
dev = ["pytest>=8,<10", "tifffile>=2024.1"]

[project.scripts]
isp-workflow = "isp_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
