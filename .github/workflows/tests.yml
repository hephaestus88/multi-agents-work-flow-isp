name: Tests and conversion smoke checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dng,dev]'
      - run: python -m pytest
      - run: python examples/generate_demo.py --output demo-data --dng
      - run: python -m isp_workflow demo-data/frame_raw10.raw --manifest demo-data/frame_raw10.json --output-dir runs/raw10 --config examples/render_config.json
      - run: python -m isp_workflow demo-data/frame_raw12.raw --manifest demo-data/frame_raw12.json --output-dir runs/raw12
      - run: python -m isp_workflow demo-data/frame.dng --output-dir runs/dng
